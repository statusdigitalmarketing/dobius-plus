# Builds the Windows installer on a real Windows machine and runs the packaged
# app through scripts/windows-smoke.mjs. node-gyp cannot cross-compile node-pty
# from macOS, so the Windows build lives here.
name: windows

on:
  push:
    branches: [feat/windows, feat/windows-max]
  # One release for both platforms (Sam, 2026-11-07): when release.sh publishes a release (Mac files), this builds
  # the Windows installer from that tag and attaches it with latest.yml, which electron-updater on Windows reads (the
  # Mac reads latest-mac.yml), so Windows updates itself like the Mac.
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default: the build, the smoke test and the diagnostic probe never hold a token that can write
# releases. Only the small `attach` job below can.
permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3's prebuilt binaries (Node's for npm ci, Electron's for the step below) through the GitHub API
      # with this run's read-only token. prebuild-install's own anonymous download from github.com/.../releases/download
      # failed for over an hour on 2026-11-08 (504s, then "No prebuilt binaries found" and a compile with no Visual
      # Studio) while the API kept working. prebuild-install takes a file from npm_config_<pkg>_local_prebuilds before
      # it downloads anything; if this step fails, the install falls back to downloading as before.
      - name: Prebuilt better-sqlite3 through the API
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/better-sqlite3'].version")
          ABI=$(node -p "process.versions.modules")
          DIR="$RUNNER_TEMP/better-sqlite3-prebuilds"
          mkdir -p "$DIR"
          gh release download "v$V" -R WiseLibs/better-sqlite3 -D "$DIR" \
            -p "better-sqlite3-v$V-node-v$ABI-win32-x64.tar.gz" -p "better-sqlite3-v$V-electron-v*-win32-x64.tar.gz"
          ls "$DIR"
          echo "npm_config_better_sqlite3_local_prebuilds=$DIR" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Unit tests (Windows port)
        run: node --import ./electron/__tests__/register.mjs --test electron/__tests__/windows-port.test.mjs electron/__tests__/osc-only.test.mjs

      # node-pty ships N-API Windows prebuilds that load under Electron as is;
      # only better-sqlite3 needs Electron's build, fetched prebuilt so nothing
      # is compiled (electron-builder's rebuild would compile node-pty).
      - name: Electron build of better-sqlite3
        shell: pwsh
        run: |
          $ev = node -p "require('./node_modules/electron/package.json').version"
          Push-Location node_modules/better-sqlite3
          npx prebuild-install --runtime electron --target $ev --arch x64 --platform win32
          Pop-Location

      # bash: PowerShell splits -c.npmRebuild=false into two arguments.
      # Signed with Azure Trusted Signing once its secrets and variables exist (docs/windows-signing.md). Until then the
      # installer is built unsigned, as before: electron-builder fails a build that has signing settings but no
      # credentials, so the settings are only passed when everything is there. No pull_request trigger runs this
      # workflow, so the secrets never reach a fork's code.
      - name: Build installer
        shell: bash
        run: |
          SIGN=()
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
             && [ -n "$AZURE_TS_ENDPOINT" ] && [ -n "$AZURE_TS_ACCOUNT" ] && [ -n "$AZURE_TS_PROFILE" ] && [ -n "$AZURE_TS_PUBLISHER" ]; then
            SIGN=(
              "-c.win.azureSignOptions.endpoint=$AZURE_TS_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_TS_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_TS_PROFILE"
              "-c.win.azureSignOptions.publisherName=$AZURE_TS_PUBLISHER"
            )
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signing with Azure Trusted Signing"
          else
            echo "No Azure Trusted Signing settings: building unsigned"
          fi
          npm run electron:build:win -- --publish never -c.npmRebuild=false "${SIGN[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ vars.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ vars.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ vars.AZURE_TS_PROFILE }}
          AZURE_TS_PUBLISHER: ${{ vars.AZURE_TS_PUBLISHER }}

      # A signed build must really be signed (and timestamped): never ship one that only looks configured.
      - name: Check the installer signature
        if: ${{ env.SIGNED == 'true' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-electron -Filter 'Dobius-Plus-Setup-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          "$($exe.Name): $($sig.Status) by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { exit 1 }

      - name: Smoke test the packaged app
        run: node scripts/windows-smoke.mjs

      - name: Real Claude Code session record on Windows (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code
          node scripts/windows-claude-probe.mjs

      - name: Upload installer
        id: installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/*.blockmap
          if-no-files-found: warn

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: smoke-out/
          if-no-files-found: warn

  # Attach the smoke-tested installer to the published release. The only job that can write releases: it runs no
  # project code and installs nothing, it takes the built files from the job above.
  attach:
    if: github.event_name == 'release'
    needs: build-and-smoke
    runs-on: ubuntu-latest
    # One attach per release at a time (a release published, unpublished and published again starts two builds):
    # the second waits and then finds the release complete.
    concurrency:
      group: windows-attach-${{ github.event.release.id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: win
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag comes in through the environment, never pasted into this script.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag: $TAG" >&2; exit 1; }
          cd win
          ls -la
          V="${TAG#v}"
          EXE="Dobius-Plus-Setup-$V.exe"
          [ -f "$EXE" ] && [ -f "$EXE.blockmap" ] && [ -f latest.yml ] || { echo "missing build files" >&2; exit 1; }
          grep -q "^version: $V$" latest.yml || { echo "latest.yml is not for $V" >&2; exit 1; }
          have="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          # Once latest.yml is on the release the Windows files are complete: nothing is ever touched again (a re-run
          # cannot replace an installer the manifest points at). Without it, nobody's updater uses the release yet, so
          # an installer left by an earlier half-finished attempt (another build, another hash) is replaced by this
          # build's, and the manifest goes up last.
          if grep -qxF latest.yml <<<"$have"; then echo "already complete"; exit 0; fi
          for f in "$EXE" "$EXE.blockmap"; do
            if grep -qxF "$f" <<<"$have"; then gh release delete-asset "$TAG" "$f" --repo "$REPO" --yes; fi
            gh release upload "$TAG" "$f" --repo "$REPO"
          done
          gh release upload "$TAG" latest.yml --repo "$REPO"
