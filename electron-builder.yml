appId: com.statusdigital.dobius-plus
productName: "Dobius+"
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  # Universal: one app that runs natively on Apple Silicon AND Intel. Builds
  # before 1.0.84 were arm64 only, and an Intel Mac refused to open them.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # The universal merge lipos each native module that differs between the x64
  # and arm64 builds (node-pty build/Release, better-sqlite3). node-pty also
  # ships per-arch prebuilds (and a stale bin/<arch>-<abi> dir) that are
  # IDENTICAL in both builds; @electron/universal refuses an identical Mach-O
  # unless it is listed here. They are already single-arch files and are only
  # a fallback: node-pty loads build/Release first.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/node-pty/{prebuilds,bin}/**"
  darkModeSupport: true
  identity: "Status Consulting Firm LLC (Z349CC556Z)"
  hardenedRuntime: true
  # gatekeeperAssess defaults to true. Enable so the local `spctl --assess`
  # check verifies the signed app is Gatekeeper-acceptable at BUILD time,
  # not when users download. Codex Apple-grade audit P3.
  gatekeeperAssess: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${name}-${version}-${arch}-mac.${ext}
dmg:
  title: "Dobius+"
  artifactName: ${name}-${version}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - dist-mobile/**/*
  - electron/**/*
  # shared/ holds modules both main and the renderer import (pairing-link.js).
  - shared/**/*
  - node_modules/node-pty/**/*
  - package.json
  # scripts/kokoro-tts.py is spawned by voice-playback.js; without it in the
  # allowlist the packaged app always falls back to `say`, even if the user ran
  # scripts/install-kokoro-tts.sh. asarUnpack below also lifts it out of asar
  # so python can read it from disk. (v1.0.80)
  - scripts/**/*
# dist-mobile MUST live on disk, not inside app.asar. express.static on an asar
# path makes Electron copy each file out to a temp file
# (<T>/.com.statusdigital.dobius-plus.XXXXXX) on first request and cache that
# path for the life of the process. macOS purges temp files untouched for ~3
# days, so on a long-running app every mobile page load turned into
# "ENOENT .com.statusdigital.dobius-plus.mZ8je5" while the phone's installed
# PWA kept working off its service-worker cache (found 2026-09-14, uptime 6d).
asarUnpack:
  - dist-mobile/**/*
  # scripts/kokoro-tts.py is spawned by voice-playback.js; python cannot read
  # from inside app.asar. (v1.0.80)
  - scripts/**/*

publish:
  provider: github
  owner: statusdigitalmarketing
  repo: dobius-plus
  # Draft-then-publish: assets (incl. the stapled DMG + stable-named copy)
  # all land on an INVISIBLE draft, then release.sh flips it live atomically.
  # 'latest' never points at a half-built release, so the permanent download
  # link and the auto-updater never see a publish window. Codex Medium.
  releaseType: draft
