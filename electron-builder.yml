appId: com.statusdigital.dobius-plus
productName: "Dobius+"
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  darkModeSupport: true
  identity: "Status Consulting Firm LLC (Z349CC556Z)"
  hardenedRuntime: true
  # gatekeeperAssess defaults to true. Enable so the local `spctl --assess`
  # check verifies the signed app is Gatekeeper-acceptable at BUILD time,
  # not when users download. Codex Apple-grade audit P3.
  gatekeeperAssess: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${name}-${version}-${arch}-mac.${ext}
dmg:
  title: "Dobius+"
  artifactName: ${name}-${version}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - dist-mobile/**/*
  - electron/**/*
  - node_modules/node-pty/**/*
  - package.json
# dist-mobile MUST live on disk, not inside app.asar. express.static on an asar
# path makes Electron copy each file out to a temp file
# (<T>/.com.statusdigital.dobius-plus.XXXXXX) on first request and cache that
# path for the life of the process. macOS purges temp files untouched for ~3
# days, so on a long-running app every mobile page load turned into
# "ENOENT .com.statusdigital.dobius-plus.mZ8je5" while the phone's installed
# PWA kept working off its service-worker cache (found 2026-09-14, uptime 6d).
asarUnpack:
  - dist-mobile/**/*

publish:
  provider: github
  owner: statusdigitalmarketing
  repo: dobius-plus
  # Draft-then-publish: assets (incl. the stapled DMG + stable-named copy)
  # all land on an INVISIBLE draft, then release.sh flips it live atomically.
  # 'latest' never points at a half-built release, so the permanent download
  # link and the auto-updater never see a publish window. Codex Medium.
  releaseType: draft
